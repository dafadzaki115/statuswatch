name: Run Checks
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger checks
        run: |
          curl --fail --show-error --silent --max-time 70 \
            -X POST "${{ secrets.APP_URL }}/api/cron/run-checks" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
